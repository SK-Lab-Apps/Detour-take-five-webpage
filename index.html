        <h1>Instead: Things To Do — a dopamine menu to stop doomscrolling</h1>
        <p>
          Instead is a <strong>dopamine menu app</strong> that helps you
          <strong>stop doomscrolling</strong> by deciding — while you're calm — what small,
          real-life things you'd rather do instead of reaching for your phone.
        </p>

        <h2>What is a dopamine menu?</h2>
        <p>
          A dopamine menu is a short, hand-written list of small things you actually enjoy,
          sorted by how much time and energy they take. When the urge to scroll hits, you don't
          negotiate — you just order off the menu. Instead groups yours into Starters (1–5 min),
          Mains (10–30 min), and Desserts (quick joy).
        </p>

        <h2>Things to do instead of scrolling</h2>
        <ul>
          <li>Step outside for two minutes</li>
          <li>Splash cold water on your face</li>
          <li>Take a real walk, no phone</li>
          <li>Read ten pages of a paper book</li>
          <li>Play one song, very loud</li>
          <li>Pet an animal</li>
        </ul>

        <h2>How it works</h2>
        <p>
          Tell Instead how you feel and how long you've got, and the menu narrows to what fits
          right now — or tap “Surprise me” for a single pick. A gentle evening nudge and a
          built-in grace day keep it kind, not shaming. No detox, no lockouts.
        </p>

        <p>
          Instead is free to start and available on the App Store and Google Play. This site uses
          JavaScript for its interactive 3D experience.
        </p>
